<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%" style="background-color: #0B0F19; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="sourceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CD7F32" />
      <stop offset="100%" stop-color="#A0522D" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C0C0C0" />
      <stop offset="100%" stop-color="#708090" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#DAA520" />
    </linearGradient>
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6F00" />
      <stop offset="100%" stop-color="#FF9E40" />
    </linearGradient>
    <linearGradient id="expectationGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Background Grid -->
  <rect width="100%" height="100%" fill="#070A13" />
  <g opacity="0.05">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350 M 0,400 L 1200,400 M 0,450 L 1200,450 M 0,500 L 1200,500 M 0,550 L 1200,550 M 0,600 L 1200,600" stroke="#FFFFFF" stroke-width="1" />
    <path d="M 100,0 L 100,650 M 200,0 L 200,650 M 300,0 L 300,650 M 400,0 L 400,650 M 500,0 L 500,650 M 600,0 L 600,650 M 700,0 L 700,650 M 800,0 L 800,650 M 900,0 L 900,650 M 1000,0 L 1000,650 M 1100,0 L 1100,650" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Title Block -->
  <text x="50" y="50" fill="#FFFFFF" font-size="24" font-weight="800" letter-spacing="1">ARQUITETURA MEDALLION &amp; PIPELINES DE DADOS</text>
  <text x="50" y="75" fill="#94A3B8" font-size="14" font-weight="400">Fluxo de Ingestão de Dados de Ponta a Ponta com Engenharia de Alta Performance</text>

  <!-- 1. DATA SOURCES SECTION -->
  <g transform="translate(50, 120)">
    <rect width="180" height="430" rx="12" fill="#0C1120" stroke="#1E293B" stroke-width="2" />
    <text x="90" y="30" fill="#38BDF8" font-size="14" font-weight="700" text-anchor="middle">FONTES DE DADOS</text>
    
    <!-- Source Types -->
    <g transform="translate(15, 60)">
      <rect width="150" height="60" rx="8" fill="url(#sourceGrad)" opacity="0.15" />
      <rect width="150" height="60" rx="8" fill="none" stroke="#6366F1" stroke-width="1" />
      <text x="75" y="28" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Multiplex Ingest</text>
      <text x="75" y="45" fill="#818CF8" font-size="10" font-weight="400" text-anchor="middle">(Várias fontes -> 1 Bronze)</text>
    </g>

    <g transform="translate(15, 140)">
      <rect width="150" height="60" rx="8" fill="url(#sourceGrad)" opacity="0.15" />
      <rect width="150" height="60" rx="8" fill="none" stroke="#6366F1" stroke-width="1" />
      <text x="75" y="28" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Singleplex Ingest</text>
      <text x="75" y="45" fill="#818CF8" font-size="10" font-weight="400" text-anchor="middle">(1 Fonte -> 1 Tabela)</text>
    </g>

    <g transform="translate(15, 220)">
      <rect width="150" height="80" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="75" y="25" fill="#F1F5F9" font-size="11" font-weight="700" text-anchor="middle">Formatos Suportados</text>
      <text x="75" y="45" fill="#94A3B8" font-size="10" text-anchor="middle">JSON, CSV, Parquet</text>
      <text x="75" y="60" fill="#94A3B8" font-size="10" text-anchor="middle">Arquivos XML, Textos</text>
    </g>

    <!-- Auto Loader Engine Banner -->
    <g transform="translate(15, 320)">
      <rect width="150" height="90" rx="8" fill="url(#engineGrad)" opacity="0.1" />
      <rect width="150" height="90" rx="8" fill="none" stroke="#FF6F00" stroke-width="1.5" />
      <text x="75" y="25" fill="#FF9E40" font-size="12" font-weight="800" text-anchor="middle">AUTO LOADER</text>
      <text x="75" y="45" fill="#E2E8F0" font-size="10" font-weight="600" text-anchor="middle">cloudFiles Engine</text>
      <text x="75" y="62" fill="#94A3B8" font-size="9" text-anchor="middle">Schema Evolution</text>
      <text x="75" y="75" fill="#94A3B8" font-size="9" text-anchor="middle">Resilient Queue</text>
    </g>
  </g>

  <!-- Connectors from Source to Bronze -->
  <path d="M 230,210 L 290,210" stroke="#FF6F00" stroke-width="2" stroke-dasharray="5 3" />
  <path d="M 230,290 L 290,290" stroke="#FF6F00" stroke-width="2" stroke-dasharray="5 3" />
  <path d="M 230,470 L 290,470" stroke="#6366F1" stroke-width="2" />

  <!-- 2. BRONZE LAYER (RAW / INGESTION) -->
  <g transform="translate(290, 120)">
    <rect width="200" height="430" rx="12" fill="#1C1412" stroke="#6E3A20" stroke-width="2" filter="url(#softGlow)" />
    <text x="100" y="30" fill="#FF8C00" font-size="14" font-weight="700" text-anchor="middle">BRONZE LAYER</text>
    <text x="100" y="48" fill="#A8A29E" font-size="10" font-weight="400" text-anchor="middle">Raw &amp; Uncleaned Ingestion</text>

    <!-- Schema & Metadata Box -->
    <g transform="translate(15, 70)">
      <rect width="170" height="120" rx="8" fill="#2C1B15" stroke="#8C4F2B" stroke-width="1" />
      <text x="15" y="25" fill="#FDBA74" font-size="11" font-weight="700">Tabela Delta Streaming</text>
      <text x="15" y="45" fill="#E7E5E4" font-size="10">✓ Payload em JSON (String)</text>
      <text x="15" y="65" fill="#E7E5E4" font-size="10">✓ _rescued_data (Evolução)</text>
      <text x="15" y="85" fill="#E7E5E4" font-size="10">✓ Nome do Arquivo / Tópico</text>
      <text x="15" y="105" fill="#E7E5E4" font-size="10">✓ Timestamp de Ingestão</text>
    </g>

    <!-- Multiplex Bronze Ingestion details -->
    <g transform="translate(15, 210)">
      <rect width="170" height="90" rx="8" fill="#18181B" stroke="#3F3F46" stroke-width="1" />
      <text x="15" y="22" fill="#E4E4E7" font-size="11" font-weight="700">Estrutura Multiplex</text>
      <text x="15" y="42" fill="#A1A1AA" font-size="9">Permite que centenas de arquivos</text>
      <text x="15" y="57" fill="#A1A1AA" font-size="9">diferentes sejam centralizados em</text>
      <text x="15" y="72" fill="#A1A1AA" font-size="9">uma única tabela de dumping rápido.</text>
    </g>

    <!-- Streaming Read badge -->
    <g transform="translate(15, 320)">
      <rect width="170" height="85" rx="8" fill="#022C22" stroke="#047857" stroke-width="1" />
      <text x="85" y="25" fill="#34D399" font-size="11" font-weight="800" text-anchor="middle">STREAMING PROCESSOR</text>
      <text x="85" y="45" fill="#E6F4EA" font-size="10" text-anchor="middle">readStream (Delta Table)</text>
      <text x="85" y="65" fill="#94A3B8" font-size="9" text-anchor="middle">Checkpoints automáticos</text>
    </g>
  </g>

  <!-- Quality Gate & SCD Connector between Bronze and Silver -->
  <g transform="translate(505, 260)">
    <line x1="0" y1="50" x2="80" y2="50" stroke="#E2E8F0" stroke-width="2" />
    <polygon points="80,50 72,45 72,55" fill="#E2E8F0" />
    
    <!-- Quality Gates Expectation box -->
    <rect x="5" y="-30" width="70" height="60" rx="6" fill="#2D0606" stroke="#EF4444" stroke-width="1" />
    <text x="40" y="-12" fill="#F87171" font-size="9" font-weight="700" text-anchor="middle">EXPECTATIONS</text>
    <text x="40" y="5" fill="#E2E8F0" font-size="8" text-anchor="middle">WARN | DROP</text>
    <text x="40" y="20" fill="#E2E8F0" font-size="8" text-anchor="middle">FAIL UPDATE</text>
  </g>

  <g transform="translate(505, 380)">
    <line x1="0" y1="20" x2="80" y2="20" stroke="#E2E8F0" stroke-width="2" />
    <polygon points="80,20 72,15 72,25" fill="#E2E8F0" />
    
    <!-- Deduplication and SCD 2 -->
    <rect x="5" y="-30" width="70" height="42" rx="6" fill="#111827" stroke="#94A3B8" stroke-width="1" />
    <text x="40" y="-15" fill="#F3F4F6" font-size="8" font-weight="700" text-anchor="middle">DEDUPLICATE</text>
    <text x="40" y="0" fill="#94A3B8" font-size="8" text-anchor="middle">&amp; SCD Type 2</text>
  </g>

  <!-- 3. SILVER LAYER (CLEANED & ENRICHED) -->
  <g transform="translate(600, 120)">
    <rect width="230" height="430" rx="12" fill="#1E293B" stroke="#64748B" stroke-width="2" filter="url(#softGlow)" />
    <text x="115" y="30" fill="#CBD5E1" font-size="14" font-weight="700" text-anchor="middle">SILVER LAYER</text>
    <text x="115" y="48" fill="#94A3B8" font-size="10" font-weight="400" text-anchor="middle">Conformed, Validated &amp; Historical</text>

    <!-- Schema Details -->
    <g transform="translate(15, 70)">
      <rect width="200" height="150" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="15" y="22" fill="#38BDF8" font-size="11" font-weight="700">Tabela Delta Organizada</text>
      <text x="15" y="42" fill="#E2E8F0" font-size="10">✓ Esquema Tipado (Cast de colunas)</text>
      <text x="15" y="62" fill="#E2E8F0" font-size="10">✓ Sem Duplicatas (Deduplicado)</text>
      <text x="15" y="82" fill="#E2E8F0" font-size="10">✓ Aplicação de Regras de Integridade</text>
      <text x="15" y="102" fill="#F87171" font-size="10">✓ SCD Tipo 1 (Sobrescrever)</text>
      <text x="15" y="122" fill="#34D399" font-size="10">✓ SCD Tipo 2 (Histórico com datas)</text>
    </g>

    <!-- CDF (Change Data Feed) -->
    <g transform="translate(15, 235)">
      <rect width="200" height="85" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1" />
      <text x="100" y="22" fill="#38BDF8" font-size="11" font-weight="700" text-anchor="middle">CHANGE DATA FEED (CDF)</text>
      <text x="10" y="42" fill="#94A3B8" font-size="9" text-anchor="start">✓ Captura Inserts, Updates, Deletes</text>
      <text x="10" y="58" fill="#94A3B8" font-size="9" text-anchor="start">✓ Otimiza propagação downstream</text>
      <text x="10" y="74" fill="#94A3B8" font-size="9" text-anchor="start">✓ `_change_type` flag automático</text>
    </g>

    <!-- Liquid Clustering Optimization Badge -->
    <g transform="translate(15, 335)">
      <rect width="200" height="80" rx="8" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1" />
      <text x="100" y="22" fill="#A5B4FC" font-size="11" font-weight="800" text-anchor="middle">LIQUID CLUSTERING</text>
      <text x="100" y="42" fill="#E2E8F0" font-size="10" text-anchor="middle">CLUSTER BY (chaves)</text>
      <text x="100" y="60" fill="#94A3B8" font-size="9" text-anchor="middle">Alta performance para filtros e queries</text>
    </g>
  </g>

  <!-- Connectors from Silver to Gold -->
  <path d="M 830,335 L 910,335" stroke="#E2E8F0" stroke-width="2" />
  <polygon points="910,335 902,330 902,340" fill="#E2E8F0" />
  <text x="870" y="325" fill="#E2E8F0" font-size="9" font-weight="700" text-anchor="middle">JOIN / AGG</text>

  <!-- 4. GOLD LAYER (ANALYTICS & BI) -->
  <g transform="translate(910, 120)">
    <rect width="240" height="430" rx="12" fill="#241E0F" stroke="#B49326" stroke-width="2" filter="url(#softGlow)" />
    <text x="120" y="30" fill="#FACC15" font-size="14" font-weight="700" text-anchor="middle">GOLD LAYER</text>
    <text x="120" y="48" fill="#E4E4E7" font-size="10" font-weight="400" text-anchor="middle">Business-Level Aggregates</text>

    <!-- Schema details -->
    <g transform="translate(15, 70)">
      <rect width="210" height="150" rx="8" fill="#3B2E10" stroke="#8E6B17" stroke-width="1" />
      <text x="15" y="22" fill="#FDE047" font-size="11" font-weight="700">Tabelas Agregadas finais</text>
      <text x="15" y="45" fill="#F5F5F5" font-size="10">✓ Visões de Negócio específicas</text>
      <text x="15" y="65" fill="#F5F5F5" font-size="10">✓ Agregações com Spark SQL</text>
      <text x="15" y="85" fill="#F5F5F5" font-size="10">✓ Data Marts estruturados</text>
      <text x="15" y="105" fill="#F5F5F5" font-size="10">✓ Alta performance para BI</text>
      <text x="15" y="125" fill="#F5F5F5" font-size="10">✓ Totalmente seguras (Unity Catalog)</text>
    </g>

    <!-- Consumers -->
    <g transform="translate(15, 235)">
      <rect width="210" height="180" rx="8" fill="#1C1917" stroke="#44403C" stroke-width="1" />
      <text x="105" y="22" fill="#A8A29E" font-size="11" font-weight="700" text-anchor="middle">CONSUMIDORES FINAIS</text>
      
      <!-- Power BI -->
      <g transform="translate(15, 38)">
        <rect width="180" height="35" rx="4" fill="#F2C811" opacity="0.15" />
        <rect width="180" height="35" rx="4" fill="none" stroke="#F2C811" stroke-width="0.8" />
        <text x="90" y="22" fill="#F3F4F6" font-size="10" font-weight="700" text-anchor="middle">Power BI Auto-Refresh API</text>
      </g>
      
      <!-- SQL Warehouse -->
      <g transform="translate(15, 83)">
        <rect width="180" height="35" rx="4" fill="#0080FF" opacity="0.15" />
        <rect width="180" height="35" rx="4" fill="none" stroke="#0080FF" stroke-width="0.8" />
        <text x="90" y="22" fill="#F3F4F6" font-size="10" font-weight="700" text-anchor="middle">Databricks Serverless SQL</text>
      </g>

      <!-- ML / AI -->
      <g transform="translate(15, 128)">
        <rect width="180" height="38" rx="4" fill="#10B981" opacity="0.15" />
        <rect width="180" height="38" rx="4" fill="none" stroke="#10B981" stroke-width="0.8" />
        <text x="90" y="23" fill="#F3F4F6" font-size="10" font-weight="700" text-anchor="middle">Data Science &amp; Machine Learning</text>
      </g>
    </g>
  </g>

  <!-- Legend / Info footer -->
  <rect x="50" y="580" width="1100" height="40" rx="6" fill="#1E293B" opacity="0.4" />
  <rect x="50" y="580" width="1100" height="40" rx="6" fill="none" stroke="#334155" stroke-width="1" />
  <text x="70" y="604" fill="#94A3B8" font-size="11">Legenda: </text>
  <circle cx="150" cy="600" r="5" fill="#6366F1" />
  <text x="165" y="604" fill="#FFFFFF" font-size="10">Ingestão de Origem</text>
  <circle cx="295" cy="600" r="5" fill="#FF8C00" />
  <text x="310" y="604" fill="#FFFFFF" font-size="10">Carregamento Bruto</text>
  <circle cx="440" cy="600" r="5" fill="#EF4444" />
  <text x="455" y="604" fill="#FFFFFF" font-size="10">Expectativas / Validações</text>
  <circle cx="595" cy="600" r="5" fill="#CBD5E1" />
  <text x="610" y="604" fill="#FFFFFF" font-size="10">Dados Conformados</text>
  <circle cx="740" cy="600" r="5" fill="#FACC15" />
  <text x="755" y="604" fill="#FFFFFF" font-size="10">Agregados de Negócio</text>
</svg>
