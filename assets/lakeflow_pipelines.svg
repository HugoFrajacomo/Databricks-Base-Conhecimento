<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="100%" height="100%" style="background-color: #0B0F19; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6F00" />
      <stop offset="100%" stop-color="#FF9E40" />
    </linearGradient>
    <linearGradient id="mvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="viewGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#070A13" />
  
  <!-- Background Grid -->
  <g opacity="0.05">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350 M 0,400 L 1200,400 M 0,450 L 1200,450 M 0,500 L 1200,500" stroke="#FFFFFF" stroke-width="1" />
    <path d="M 100,0 L 100,550 M 200,0 L 200,550 M 300,0 L 300,550 M 400,0 L 400,550 M 500,0 L 500,550 M 600,0 L 600,550 M 700,0 L 700,550 M 800,0 L 800,550 M 900,0 L 900,550 M 1000,0 L 1000,550 M 1100,0 L 1100,550" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Title Block -->
  <text x="50" y="45" fill="#FFFFFF" font-size="22" font-weight="800" letter-spacing="1">LAKEFLOW DECLARATIVE PIPELINES (LDP) &amp; DELTA LIVE TABLES</text>
  <text x="50" y="68" fill="#94A3B8" font-size="13" font-weight="400">Framework Declarativo de ETL: Streaming Tables, Materialized Views, Views &amp; Data Quality Expectations</text>

  <!-- COMPARISON SCHEMAS -->
  
  <!-- Object 1: Streaming Table -->
  <g transform="translate(50, 110)">
    <rect width="340" height="380" rx="10" fill="#0C1120" stroke="#FF6F00" stroke-width="1.5" filter="url(#softGlow)" />
    <text x="170" y="30" fill="#FF9E40" font-size="14" font-weight="800" text-anchor="middle">STREAMING TABLES (ST)</text>
    <text x="170" y="48" fill="#94A3B8" font-size="10" text-anchor="middle">CREATE OR REFRESH STREAMING TABLE</text>

    <!-- Graphic element -->
    <g transform="translate(25, 75)">
      <rect width="290" height="150" rx="6" fill="#1C1412" stroke="#8C4F2B" stroke-width="1" />
      
      <!-- Inflow stream line -->
      <g transform="translate(15, 20)">
        <path d="M 0,25 Q 70,0 140,25 T 260,25" fill="none" stroke="#FF6F00" stroke-width="2" stroke-dasharray="4 2" />
        <!-- Moving stream nodes -->
        <circle cx="40" cy="18" r="4" fill="#FF9E40" />
        <circle cx="110" cy="15" r="4" fill="#FF9E40" />
        <circle cx="180" cy="30" r="4" fill="#FF9E40" />
        <circle cx="230" cy="22" r="4" fill="#FF9E40" />
      </g>
      
      <!-- Checkpoint / State -->
      <g transform="translate(15, 80)">
        <rect width="260" height="50" rx="4" fill="#2C1B15" stroke="#FF6F00" stroke-width="0.8" />
        <text x="130" y="20" fill="#FF9E40" font-size="10" font-weight="700" text-anchor="middle">INCREMENTAL INGESTION ONLY</text>
        <text x="130" y="35" fill="#E2E8F0" font-size="9" text-anchor="middle">✓ Checkpoint automático &amp; State management</text>
      </g>
    </g>

    <!-- Details -->
    <g transform="translate(25, 245)">
      <rect width="290" height="110" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="15" y="20" fill="#FF9E40" font-size="11" font-weight="700">Quando Utilizar:</text>
      <text x="15" y="42" fill="#E4E4E7" font-size="10">✓ Fontes contínuas ou incrementais (Auto Loader, Kafka)</text>
      <text x="15" y="60" fill="#E4E4E7" font-size="10">✓ Requer baixíssima latência de processamento</text>
      <text x="15" y="78" fill="#E4E4E7" font-size="10">✓ Para tabelas Bronze e Silver no fluxo Medallion</text>
      <text x="15" y="96" fill="#E4E4E7" font-size="10">✓ Preserva histórico completo das transações</text>
    </g>
  </g>

  <!-- Object 2: Materialized View -->
  <g transform="translate(430, 110)">
    <rect width="340" height="380" rx="10" fill="#0C1120" stroke="#06B6D4" stroke-width="1.5" filter="url(#softGlow)" />
    <text x="170" y="30" fill="#22D3EE" font-size="14" font-weight="800" text-anchor="middle">MATERIALIZED VIEWS (MV)</text>
    <text x="170" y="48" fill="#94A3B8" font-size="10" text-anchor="middle">CREATE OR REFRESH MATERIALIZED VIEW</text>

    <!-- Graphic element -->
    <g transform="translate(25, 75)">
      <rect width="290" height="150" rx="6" fill="#121B24" stroke="#1E4D5A" stroke-width="1" />
      
      <!-- Pre-computed cache tables -->
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="110" height="40" rx="4" fill="#0E2D38" stroke="#0891B2" stroke-width="0.8" />
        <text x="55" y="24" fill="#67E8F9" font-size="9" font-weight="700" text-anchor="middle">Source Query SQL</text>
        
        <rect x="140" y="0" width="110" height="40" rx="4" fill="url(#mvGrad)" opacity="0.3" stroke="#0891B2" stroke-width="0.8" />
        <text x="195" y="24" fill="#67E8F9" font-size="9" font-weight="700" text-anchor="middle">Pre-Computed Data</text>

        <path d="M 110,20 L 140,20" stroke="#06B6D4" stroke-width="1.5" />
        <polygon points="140,20 134,17 134,23" fill="#06B6D4" />
      </g>
      
      <!-- Aggregation summary -->
      <g transform="translate(20, 80)">
        <rect width="250" height="50" rx="4" fill="#0B131A" stroke="#06B6D4" stroke-width="0.8" />
        <text x="125" y="20" fill="#22D3EE" font-size="10" font-weight="700" text-anchor="middle">AUTOMATIC FULL/INCREMENTAL RECOMPUTE</text>
        <text x="125" y="35" fill="#E2E8F0" font-size="9" text-anchor="middle">✓ Atualiza apenas quando a origem muda</text>
      </g>
    </g>

    <!-- Details -->
    <g transform="translate(25, 245)">
      <rect width="290" height="110" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="15" y="20" fill="#06B6D4" font-size="11" font-weight="700">Quando Utilizar:</text>
      <text x="15" y="42" fill="#E4E4E7" font-size="10">✓ Para agregações complexas, joins pesados ou filtros</text>
      <text x="15" y="60" fill="#E4E4E7" font-size="10">✓ Excelente para Gold tables voltadas a BI/Power BI</text>
      <text x="15" y="78" fill="#E4E4E7" font-size="10">✓ Dados de origem mudam de forma não-incremental</text>
      <text x="15" y="96" fill="#E4E4E7" font-size="10">✓ Reduz tempo de query salvando resultados físicos</text>
    </g>
  </g>

  <!-- Object 3: View -->
  <g transform="translate(810, 110)">
    <rect width="340" height="380" rx="10" fill="#0C1120" stroke="#10B981" stroke-width="1.5" filter="url(#softGlow)" />
    <text x="170" y="30" fill="#34D399" font-size="14" font-weight="800" text-anchor="middle">STANDARD VIEWS (V)</text>
    <text x="170" y="48" fill="#94A3B8" font-size="10" text-anchor="middle">CREATE OR REPLACE TEMPORARY VIEW</text>

    <!-- Graphic element -->
    <g transform="translate(25, 75)">
      <rect width="290" height="150" rx="6" fill="#111B17" stroke="#1B4235" stroke-width="1" />
      
      <!-- Virtual view layer -->
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="250" height="40" rx="4" fill="none" stroke="#10B981" stroke-dasharray="3 3" stroke-width="1.5" />
        <text x="125" y="24" fill="#34D399" font-size="10" font-weight="800" text-anchor="middle">VIRTUAL LAYER (NO STORAGE)</text>
      </g>
      
      <!-- Live query -->
      <g transform="translate(20, 80)">
        <rect width="250" height="50" rx="4" fill="#0B131A" stroke="#10B981" stroke-width="0.8" />
        <text x="125" y="20" fill="#34D399" font-size="10" font-weight="700" text-anchor="middle">RUNS ON EVERY QUERY CALL</text>
        <text x="125" y="35" fill="#E2E8F0" font-size="9" text-anchor="middle">✓ Computação em tempo real (On-the-fly)</text>
      </g>
    </g>

    <!-- Details -->
    <g transform="translate(25, 245)">
      <rect width="290" height="110" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="15" y="20" fill="#10B981" font-size="11" font-weight="700">Quando Utilizar:</text>
      <text x="15" y="42" fill="#E4E4E7" font-size="10">✓ Filtros rápidos de segurança (Row/Col Security)</text>
      <text x="15" y="60" fill="#E4E4E7" font-size="10">✓ Para não duplicar espaço físico em disco</text>
      <text x="15" y="78" fill="#E4E4E7" font-size="10">✓ Visões intermediárias rápidas dentro do pipeline</text>
      <text x="15" y="96" fill="#E4E4E7" font-size="10">✓ Transformações leves que não justificam custos de MV</text>
    </g>
  </g>
</svg>
