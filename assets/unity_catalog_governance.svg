<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="100%" height="100%" style="background-color: #0B0F19; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="ucGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="fedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#070A13" />
  
  <!-- Background Grid -->
  <g opacity="0.05">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350 M 0,400 L 1200,400 M 0,450 L 1200,450 M 0,500 L 1200,500" stroke="#FFFFFF" stroke-width="1" />
    <path d="M 100,0 L 100,550 M 200,0 L 200,550 M 300,0 L 300,550 M 400,0 L 400,550 M 500,0 L 500,550 M 600,0 L 600,550 M 700,0 L 700,550 M 800,0 L 800,550 M 900,0 L 900,550 M 1000,0 L 1000,550 M 1100,0 L 1100,550" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Title Block -->
  <text x="50" y="45" fill="#FFFFFF" font-size="22" font-weight="800" letter-spacing="1">GOVERNANÇA &amp; COMPARTILHAMENTO COM UNITY CATALOG</text>
  <text x="50" y="68" fill="#94A3B8" font-size="13" font-weight="400">Unity Catalog 3-Level Namespace, Dynamic Security Views, Delta Sharing &amp; Federation</text>

  <!-- SECTION 1: 3-LEVEL NAMESPACE -->
  <g transform="translate(50, 110)">
    <rect width="330" height="380" rx="10" fill="#0C1120" stroke="#10B981" stroke-width="1.5" filter="url(#softGlow)" />
    <text x="165" y="30" fill="#34D399" font-size="14" font-weight="800" text-anchor="middle">UNITY CATALOG NAMESPACE</text>
    <text x="165" y="48" fill="#94A3B8" font-size="10" text-anchor="middle">Estrutura de Namespace de 3 Níveis</text>

    <!-- Visual hierarchy -->
    <g transform="translate(25, 75)">
      <!-- Level 1: Catalog -->
      <rect x="0" y="0" width="280" height="40" rx="6" fill="url(#ucGrad)" opacity="0.15" stroke="#10B981" stroke-width="1" />
      <text x="20" y="24" fill="#A7F3D0" font-size="12" font-weight="800">1. CATALOG (Ex: prod_catalog)</text>
      <text x="260" y="24" fill="#94A3B8" font-size="10" text-anchor="end">Contêiner de dados</text>
      
      <!-- Level 2: Schema -->
      <g transform="translate(20, 55)">
        <rect x="0" y="0" width="260" height="40" rx="6" fill="url(#ucGrad)" opacity="0.1" stroke="#34D399" stroke-width="0.8" />
        <text x="20" y="24" fill="#A7F3D0" font-size="11" font-weight="800">2. SCHEMA (Ex: sales_schema)</text>
        <text x="240" y="24" fill="#94A3B8" font-size="9" text-anchor="end">Agrupamento lógico</text>
      </g>
      
      <!-- Level 3: Table / View / Volume -->
      <g transform="translate(40, 110)">
        <rect x="0" y="0" width="240" height="55" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
        <text x="15" y="20" fill="#E2E8F0" font-size="10" font-weight="800">3. OBJECTS (Tabela / View / Volume)</text>
        <text x="15" y="34" fill="#94A3B8" font-size="9">✓ delta_table (Ex: prod_catalog.sales_schema.orders)</text>
        <text x="15" y="46" fill="#94A3B8" font-size="9">✓ external_volume (Armazenamento não estruturado)</text>
      </g>
    </g>

    <!-- Details -->
    <g transform="translate(25, 260)">
      <rect width="280" height="95" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="15" y="20" fill="#34D399" font-size="11" font-weight="700">Segurança de Nível Dinâmico:</text>
      <text x="15" y="40" fill="#E4E4E7" font-size="10">✓ Row Filtering: `FILTER ON (country = 'BR')`</text>
      <text x="15" y="58" fill="#E4E4E7" font-size="10">✓ Column Masking: `MASK USING (redact_email)`</text>
      <text x="15" y="76" fill="#A7F3D0" font-size="10" font-weight="600">✓ Dynamic Views: `is_account_group_member()`</text>
    </g>
  </g>

  <!-- SECTION 2: DELTA SHARING -->
  <g transform="translate(415, 110)">
    <rect width="370" height="380" rx="10" fill="#0C1120" stroke="#3B82F6" stroke-width="1.5" filter="url(#softGlow)" />
    <text x="185" y="30" fill="#60A5FA" font-size="14" font-weight="800" text-anchor="middle">DELTA SHARING PROTOCOL</text>
    <text x="185" y="48" fill="#94A3B8" font-size="10" text-anchor="middle">Compartilhamento Seguro em Tempo Real sem Cópia de Dados</text>

    <!-- Sharing diagram -->
    <g transform="translate(20, 70)">
      <!-- Provider Delta Lake -->
      <rect x="0" y="10" width="100" height="70" rx="6" fill="#1e293b" stroke="#3B82F6" stroke-width="1" />
      <text x="50" y="32" fill="#93C5FD" font-size="10" font-weight="700" text-anchor="middle">Databricks</text>
      <text x="50" y="48" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">PROVIDER</text>
      <text x="50" y="62" fill="#60A5FA" font-size="9" text-anchor="middle">Delta Table</text>

      <!-- Center sharing engine -->
      <circle cx="165" cy="45" r="22" fill="url(#shareGrad)" opacity="0.3" stroke="#3B82F6" stroke-width="1" />
      <text x="165" y="49" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">SHARE</text>

      <!-- Receiver 1: Databricks recipient -->
      <rect x="230" y="-10" width="100" height="50" rx="6" fill="#111827" stroke="#10B981" stroke-width="1" />
      <text x="280" y="15" fill="#34D399" font-size="9" font-weight="700" text-anchor="middle">Databricks to</text>
      <text x="280" y="28" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">Databricks (D2D)</text>
      <text x="280" y="40" fill="#94A3B8" font-size="8" text-anchor="middle">Sem token / Direto</text>

      <!-- Receiver 2: External recipient -->
      <rect x="230" y="55" width="100" height="55" rx="6" fill="#111827" stroke="#F59E0B" stroke-width="1" />
      <text x="280" y="75" fill="#FBBF24" font-size="9" font-weight="700" text-anchor="middle">Open Sharing</text>
      <text x="280" y="88" fill="#FFFFFF" font-size="8" text-anchor="middle">Pandas, Power BI, Spark</text>
      <text x="280" y="99" fill="#94A3B8" font-size="8" text-anchor="middle">Secure Credential Token</text>

      <!-- Connector Arrows -->
      <line x1="100" y1="45" x2="143" y2="45" stroke="#3B82F6" stroke-width="1.5" />
      <polygon points="143,45 137,42 137,48" fill="#3B82F6" />

      <path d="M 187,45 L 210,45 L 210,15 L 230,15" fill="none" stroke="#10B981" stroke-width="1.5" />
      <polygon points="230,15 224,12 224,18" fill="#10B981" />

      <path d="M 187,45 L 210,45 L 210,80 L 230,80" fill="none" stroke="#F59E0B" stroke-width="1.5" />
      <polygon points="230,80 224,77 224,83" fill="#F59E0B" />
    </g>

    <!-- Details -->
    <g transform="translate(20, 260)">
      <rect width="330" height="95" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="15" y="20" fill="#60A5FA" font-size="11" font-weight="700">Benefícios e Segurança do Compartilhamento:</text>
      <text x="15" y="40" fill="#E4E4E7" font-size="10">✓ Sem Cópia de Dados: Consumidores leem do S3/ADLS do provedor</text>
      <text x="15" y="58" fill="#E4E4E7" font-size="10">✓ Governança: Totalmente auditado pelo logs do Unity Catalog</text>
      <text x="15" y="76" fill="#E4E4E7" font-size="10">✓ Segurança: Tokens revocáveis com restrição de IP e expiração</text>
    </g>
  </g>

  <!-- SECTION 3: LAKEHOUSE FEDERATION -->
  <g transform="translate(815, 110)">
    <rect width="335" height="380" rx="10" fill="#0C1120" stroke="#F59E0B" stroke-width="1.5" filter="url(#softGlow)" />
    <text x="167" y="30" fill="#FBBF24" font-size="14" font-weight="800" text-anchor="middle">LAKEHOUSE FEDERATION</text>
    <text x="167" y="48" fill="#94A3B8" font-size="10" text-anchor="middle">Query Remota Integrada sem Duplicação de Dados</text>

    <!-- Federation structure -->
    <g transform="translate(25, 75)">
      <!-- Unity Catalog Core -->
      <rect x="50" y="0" width="180" height="40" rx="6" fill="url(#ucGrad)" opacity="0.2" stroke="#10B981" stroke-width="1" />
      <text x="140" y="24" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">UNITY CATALOG QUERY ENGINE</text>
      
      <!-- Query pushdown lines -->
      <path d="M 140,40 L 140,80 M 140,60 L 40,60 L 40,80 M 140,60 L 240,60 L 240,80" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 2" />
      <polygon points="40,80 37,74 43,74" fill="#F59E0B" />
      <polygon points="140,80 137,74 143,74" fill="#F59E0B" />
      <polygon points="240,80 237,74 243,74" fill="#F59E0B" />

      <!-- External Databases sources -->
      <rect x="0" y="80" width="80" height="50" rx="4" fill="#1C1810" stroke="#F59E0B" stroke-width="0.8" />
      <text x="40" y="24" fill="#E2E8F0" font-size="9" font-weight="700" text-anchor="middle">Snowflake</text>
      <text x="40" y="38" fill="#F59E0B" font-size="8" text-anchor="middle">Federated</text>

      <rect x="100" y="80" width="80" height="50" rx="4" fill="#1C1810" stroke="#F59E0B" stroke-width="0.8" />
      <text x="50" y="24" fill="#E2E8F0" font-size="9" font-weight="700" text-anchor="middle">PostgreSQL</text>
      <text x="50" y="38" fill="#F59E0B" font-size="8" text-anchor="middle">Federated</text>

      <rect x="200" y="80" width="80" height="50" rx="4" fill="#1C1810" stroke="#F59E0B" stroke-width="0.8" />
      <text x="40" y="24" fill="#E2E8F0" font-size="9" font-weight="700" text-anchor="middle">Azure SQL</text>
      <text x="40" y="38" fill="#F59E0B" font-size="8" text-anchor="middle">Federated</text>
    </g>

    <!-- Details -->
    <g transform="translate(25, 260)">
      <rect width="280" height="95" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="15" y="20" fill="#FBBF24" font-size="11" font-weight="700">Por que Federação de Dados?</text>
      <text x="15" y="40" fill="#E4E4E7" font-size="10">✓ Consulta Unificada: Query SQL única une fontes externas</text>
      <text x="15" y="58" fill="#E4E4E7" font-size="10">✓ Query Pushdown: Processa filtros na origem remota</text>
      <text x="15" y="76" fill="#E4E4E7" font-size="10">✓ Governança: Estende regras do UC para bancos externos</text>
    </g>
  </g>
</svg>
