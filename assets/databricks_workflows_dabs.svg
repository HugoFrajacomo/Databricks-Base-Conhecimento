<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="100%" height="100%" style="background-color: #0B0F19; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="workflowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="dabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6F00" />
      <stop offset="100%" stop-color="#FF9E40" />
    </linearGradient>
    <linearGradient id="pbiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C811" />
      <stop offset="100%" stop-color="#D5A900" />
    </linearGradient>
    
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#070A13" />
  
  <!-- Background Grid -->
  <g opacity="0.05">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350 M 0,400 L 1200,400 M 0,450 L 1200,450 M 0,500 L 1200,500" stroke="#FFFFFF" stroke-width="1" />
    <path d="M 100,0 L 100,550 M 200,0 L 200,550 M 300,0 L 300,550 M 400,0 L 400,550 M 500,0 L 500,550 M 600,0 L 600,550 M 700,0 L 700,550 M 800,0 L 800,550 M 900,0 L 900,550 M 1000,0 L 1000,550 M 1100,0 L 1100,550" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Title Block -->
  <text x="50" y="45" fill="#FFFFFF" font-size="22" font-weight="800" letter-spacing="1">ORQUESTRAÇÃO DE WORKFLOWS &amp; DEPLOY COM DABs</text>
  <text x="50" y="68" fill="#94A3B8" font-size="13" font-weight="400">Databricks Multi-Task Jobs, Auto Refresh Power BI &amp; Ciclo de CI/CD com Databricks Asset Bundles</text>

  <!-- SECTION 1: DATABRICKS WORKFLOWS -->
  <g transform="translate(50, 110)">
    <rect width="520" height="380" rx="10" fill="#0C1120" stroke="#3B82F6" stroke-width="1.5" filter="url(#softGlow)" />
    <text x="260" y="30" fill="#60A5FA" font-size="14" font-weight="800" text-anchor="middle">DATABRICKS WORKFLOWS (MULTI-TASK JOBS)</text>
    <text x="260" y="48" fill="#94A3B8" font-size="10" text-anchor="middle">Grafo de Dependência Dinâmico (DAG)</text>

    <!-- DAG Visual Graphic -->
    <g transform="translate(30, 70)">
      <rect width="460" height="170" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1" />
      
      <!-- Task 1: Ingestion (Bronze) -->
      <g transform="translate(20, 60)">
        <rect width="110" height="40" rx="6" fill="url(#workflowGrad)" opacity="0.3" stroke="#3B82F6" stroke-width="1" />
        <text x="55" y="24" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">Task 1: Ingest (ST)</text>
      </g>
      
      <!-- Task 2: Silver customer -->
      <g transform="translate(170, 20)">
        <rect width="110" height="40" rx="6" fill="url(#workflowGrad)" opacity="0.3" stroke="#3B82F6" stroke-width="1" />
        <text x="55" y="24" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">Task 2: Silver Cust</text>
      </g>
      
      <!-- Task 3: Silver books -->
      <g transform="translate(170, 100)">
        <rect width="110" height="40" rx="6" fill="url(#workflowGrad)" opacity="0.3" stroke="#3B82F6" stroke-width="1" />
        <text x="55" y="24" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">Task 3: Silver Books</text>
      </g>

      <!-- Task 4: Gold Aggregates -->
      <g transform="translate(320, 60)">
        <rect width="120" height="40" rx="6" fill="url(#workflowGrad)" opacity="0.3" stroke="#06B6D4" stroke-width="1" />
        <text x="60" y="24" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">Task 4: Gold Join</text>
      </g>

      <!-- Power BI Refresh triggered at the end -->
      <g transform="translate(320, 120)">
        <rect width="120" height="35" rx="6" fill="url(#pbiGrad)" opacity="0.2" stroke="#F2C811" stroke-width="1" />
        <text x="60" y="21" fill="#FBBF24" font-size="9" font-weight="800" text-anchor="middle">Task 5: Power BI</text>
        <text x="60" y="30" fill="#94A3B8" font-size="7" text-anchor="middle">Semantic Auto-Refresh API</text>
      </g>

      <!-- DAG Connectors -->
      <!-- Task 1 to Task 2 & 3 -->
      <path d="M 130,80 L 150,80 L 150,40 L 170,40" fill="none" stroke="#60A5FA" stroke-width="1.5" />
      <polygon points="170,40 164,37 164,43" fill="#60A5FA" />
      
      <path d="M 130,80 L 150,80 L 150,120 L 170,120" fill="none" stroke="#60A5FA" stroke-width="1.5" />
      <polygon points="170,120 164,117 164,123" fill="#60A5FA" />

      <!-- Task 2 & 3 to Task 4 -->
      <path d="M 280,40 L 300,40 L 300,80 L 320,80" fill="none" stroke="#60A5FA" stroke-width="1.5" />
      <polygon points="320,80 314,77 314,83" fill="#60A5FA" />

      <path d="M 280,120 L 300,120 L 300,80 L 320,80" fill="none" stroke="#60A5FA" stroke-width="1.5" />

      <!-- Task 4 to Task 5 (Power BI API refresh) -->
      <path d="M 380,100 L 380,120" fill="none" stroke="#F2C811" stroke-width="1.5" stroke-dasharray="2 2" />
      <polygon points="380,120 377,114 383,114" fill="#F2C811" />
    </g>

    <!-- Details -->
    <g transform="translate(30, 255)">
      <rect width="460" height="100" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="15" y="20" fill="#60A5FA" font-size="11" font-weight="700">Controles &amp; Integrações:</text>
      <text x="15" y="42" fill="#E4E4E7" font-size="10">✓ Orquestração Modular: Reutilize clusters SQL Warehouse ou Serverless</text>
      <text x="15" y="60" fill="#E4E4E7" font-size="10">✓ Parâmetros Dinâmicos: Envie widgets ou arguments em runtime</text>
      <text x="15" y="78" fill="#E4E4E7" font-size="10">✓ Power BI Sync: Auto-refresh acionado via Service Principal na Azure</text>
    </g>
  </g>

  <!-- SECTION 2: DATABRICKS ASSET BUNDLES -->
  <g transform="translate(600, 110)">
    <rect width="550" height="380" rx="10" fill="#0C1120" stroke="#FF6F00" stroke-width="1.5" filter="url(#softGlow)" />
    <text x="275" y="30" fill="#FF9E40" font-size="14" font-weight="800" text-anchor="middle">DATABRICKS ASSET BUNDLES (DABs)</text>
    <text x="275" y="48" fill="#94A3B8" font-size="10" text-anchor="middle">Configuração como Código (IaC) e Pipelines de CI/CD</text>

    <!-- DABs Cycle Graphic -->
    <g transform="translate(25, 70)">
      <rect width="500" height="170" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1" />
      
      <!-- Local Develop -->
      <g transform="translate(15, 60)">
        <rect width="90" height="45" rx="6" fill="#1E293B" stroke="#FF6F00" stroke-width="1" />
        <text x="45" y="22" fill="#FFFFFF" font-size="9" font-weight="800" text-anchor="middle">1. DESENVOLVE</text>
        <text x="45" y="35" fill="#FF9E40" font-size="8" font-weight="700" text-anchor="middle">databricks.yml</text>
      </g>

      <!-- Bundle Validate -->
      <g transform="translate(135, 60)">
        <rect width="95" height="45" rx="6" fill="#1E293B" stroke="#FF6F00" stroke-width="1" />
        <text x="47.5" y="22" fill="#FFFFFF" font-size="9" font-weight="800" text-anchor="middle">2. VALIDA</text>
        <text x="47.5" y="35" fill="#A7F3D0" font-size="8" font-weight="700" text-anchor="middle">bundle validate</text>
      </g>

      <!-- Bundle Deploy -->
      <g transform="translate(260, 60)">
        <rect width="95" height="45" rx="6" fill="#1E293B" stroke="#FF6F00" stroke-width="1" />
        <text x="47.5" y="22" fill="#FFFFFF" font-size="9" font-weight="800" text-anchor="middle">3. DEPLOY (Dev/Prod)</text>
        <text x="47.5" y="35" fill="#38BDF8" font-size="8" font-weight="700" text-anchor="middle">bundle deploy</text>
      </g>

      <!-- Bundle Run -->
      <g transform="translate(385, 60)">
        <rect width="95" height="45" rx="6" fill="#1E293B" stroke="#FF6F00" stroke-width="1" />
        <text x="47.5" y="22" fill="#FFFFFF" font-size="9" font-weight="800" text-anchor="middle">4. EXECUTA</text>
        <text x="47.5" y="35" fill="#F87171" font-size="8" font-weight="700" text-anchor="middle">bundle run &lt;job&gt;</text>
      </g>

      <!-- Connectors -->
      <line x1="105" y1="82.5" x2="135" y2="82.5" stroke="#FF6F00" stroke-width="1.5" />
      <polygon points="135,82.5 129,79.5 129,85.5" fill="#FF6F00" />

      <line x1="230" y1="82.5" x2="260" y2="82.5" stroke="#FF6F00" stroke-width="1.5" />
      <polygon points="260,82.5 254,79.5 254,85.5" fill="#FF6F00" />

      <line x1="355" y1="82.5" x2="385" y2="82.5" stroke="#FF6F00" stroke-width="1.5" />
      <polygon points="385,82.5 379,79.5 379,85.5" fill="#FF6F00" />
      
      <path d="M 432.5,105 L 432.5,125 L 60,125 L 60,105" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 2" />
      <text x="246" y="138" fill="#94A3B8" font-size="8" text-anchor="middle">Ciclo iterativo rápido para desenvolvimento de Pipelines</text>
    </g>

    <!-- Details -->
    <g transform="translate(25, 255)">
      <rect width="500" height="100" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="15" y="20" fill="#FF9E40" font-size="11" font-weight="700">Por que adotar DABs no CI/CD?</text>
      <text x="15" y="42" fill="#E4E4E7" font-size="10">✓ Infraestrutura como Código: Define tarefas, alertas e schedules em YAML</text>
      <text x="15" y="60" fill="#E4E4E7" font-size="10">✓ Ambientes Separados: Alternância simples entre ambientes dev, staging e prod</text>
      <text x="15" y="78" fill="#E4E4E7" font-size="10">✓ CI/CD Automation: Facilmente integrável ao GitHub Actions ou Azure DevOps</text>
    </g>
  </g>
</svg>
