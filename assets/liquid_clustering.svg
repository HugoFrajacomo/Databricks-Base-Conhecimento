<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="100%" height="100%" style="background-color: #0B0F19; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="partitionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="zorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#070A13" />
  
  <!-- Background Grid -->
  <g opacity="0.05">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350 M 0,400 L 1200,400 M 0,450 L 1200,450 M 0,500 L 1200,500" stroke="#FFFFFF" stroke-width="1" />
    <path d="M 100,0 L 100,550 M 200,0 L 200,550 M 300,0 L 300,550 M 400,0 L 400,550 M 500,0 L 500,550 M 600,0 L 600,550 M 700,0 L 700,550 M 800,0 L 800,550 M 900,0 L 900,550 M 1000,0 L 1000,550 M 1100,0 L 1100,550" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Title Block -->
  <text x="50" y="45" fill="#FFFFFF" font-size="22" font-weight="800" letter-spacing="1">OTIMIZAÇÃO DE LAYOUT FÍSICO DE DADOS NO DELTA LAKE</text>
  <text x="50" y="68" fill="#94A3B8" font-size="13" font-weight="400">Comparativo Técnico: Hive Partitioning vs. Z-Order vs. Liquid Clustering</text>

  <!-- SECTION 1: HIVE PARTITIONING -->
  <g transform="translate(50, 110)">
    <rect width="340" height="380" rx="10" fill="#0C1120" stroke="#EF4444" stroke-width="1" opacity="0.85" />
    <rect width="340" height="380" rx="10" fill="none" stroke="#EF4444" stroke-width="1.5" filter="url(#softGlow)" />
    
    <text x="170" y="30" fill="#F87171" font-size="14" font-weight="800" text-anchor="middle">PARTICIONAMENTO HIVE</text>
    <text x="170" y="48" fill="#94A3B8" font-size="10" text-anchor="middle">PARTITIONED BY (coluna)</text>

    <!-- Visual Representation of Directory structure -->
    <g transform="translate(30, 75)">
      <rect width="280" height="150" rx="6" fill="#1C1818" stroke="#451A1A" stroke-width="1" />
      <!-- Directories representation -->
      <g transform="translate(15, 15)">
        <rect x="0" y="0" width="110" height="30" rx="4" fill="url(#partitionGrad)" opacity="0.2" />
        <rect x="0" y="0" width="110" height="30" rx="4" fill="none" stroke="#EF4444" stroke-width="0.8" />
        <text x="55" y="18" fill="#FCA5A5" font-size="10" text-anchor="middle">/ano=2026/mes=01/</text>
        <circle cx="230" cy="15" r="4" fill="#EF4444" />
        <line x1="110" y1="15" x2="225" y2="15" stroke="#EF4444" stroke-width="1" stroke-dasharray="2 2" />
        <text x="245" y="18" fill="#94A3B8" font-size="9">10 small files</text>
      </g>
      
      <g transform="translate(15, 55)">
        <rect x="0" y="0" width="110" height="30" rx="4" fill="url(#partitionGrad)" opacity="0.2" />
        <rect x="0" y="0" width="110" height="30" rx="4" fill="none" stroke="#EF4444" stroke-width="0.8" />
        <text x="55" y="18" fill="#FCA5A5" font-size="10" text-anchor="middle">/ano=2026/mes=02/</text>
        <circle cx="230" cy="15" r="4" fill="#EF4444" />
        <line x1="110" y1="15" x2="225" y2="15" stroke="#EF4444" stroke-width="1" stroke-dasharray="2 2" />
        <text x="245" y="18" fill="#94A3B8" font-size="9">12 small files</text>
      </g>
      
      <g transform="translate(15, 95)">
        <rect x="0" y="0" width="110" height="30" rx="4" fill="url(#partitionGrad)" opacity="0.2" />
        <rect x="0" y="0" width="110" height="30" rx="4" fill="none" stroke="#EF4444" stroke-width="0.8" />
        <text x="55" y="18" fill="#FCA5A5" font-size="10" text-anchor="middle">/ano=2026/mes=03/</text>
        <circle cx="230" cy="15" r="4" fill="#EF4444" />
        <line x1="110" y1="15" x2="225" y2="15" stroke="#EF4444" stroke-width="1" stroke-dasharray="2 2" />
        <text x="245" y="18" fill="#94A3B8" font-size="9">15 small files</text>
      </g>
    </g>

    <!-- Cons & Details -->
    <g transform="translate(30, 245)">
      <rect width="280" height="110" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="15" y="20" fill="#FCA5A5" font-size="11" font-weight="700">Pontos Fracos e Limitações:</text>
      <text x="15" y="42" fill="#E4E4E7" font-size="10">❌ Over-partitioning (Muitos arquivos pequenos)</text>
      <text x="15" y="60" fill="#E4E4E7" font-size="10">❌ Difícil Alteração: Exige reescrever toda a tabela</text>
      <text x="15" y="78" fill="#E4E4E7" font-size="10">❌ Funciona apenas para colunas de baixa cardinalidade</text>
      <text x="15" y="96" fill="#E4E4E7" font-size="10">❌ Ignora data skipping em colunas não-particionadas</text>
    </g>
  </g>

  <!-- SECTION 2: Z-ORDER INDEXING -->
  <g transform="translate(430, 110)">
    <rect width="340" height="380" rx="10" fill="#0C1120" stroke="#3B82F6" stroke-width="1" opacity="0.85" />
    <rect width="340" height="380" rx="10" fill="none" stroke="#3B82F6" stroke-width="1.5" filter="url(#softGlow)" />
    
    <text x="170" y="30" fill="#93C5FD" font-size="14" font-weight="800" text-anchor="middle">Z-ORDER INDEXING</text>
    <text x="170" y="48" fill="#94A3B8" font-size="10" text-anchor="middle">OPTIMIZE tabela Z-ORDER BY (col1, col2)</text>

    <!-- Z-Order Curve representation -->
    <g transform="translate(30, 75)">
      <rect width="280" height="150" rx="6" fill="#181C26" stroke="#253E66" stroke-width="1" />
      
      <!-- Curve Path -->
      <path d="M 60,35 L 140,35 L 60,115 L 140,115 M 140,35 L 220,35 L 140,115 L 220,115" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="3 1" />
      
      <!-- Nodes on Curve -->
      <circle cx="60" cy="35" r="5" fill="#3B82F6" />
      <circle cx="140" cy="35" r="5" fill="#3B82F6" />
      <circle cx="60" cy="115" r="5" fill="#3B82F6" />
      <circle cx="140" cy="115" r="5" fill="#3B82F6" />
      <circle cx="220" cy="35" r="5" fill="#3B82F6" />
      <circle cx="220" cy="115" r="5" fill="#3B82F6" />
      
      <text x="140" y="140" fill="#93C5FD" font-size="9" font-weight="700" text-anchor="middle">Curva de Hilbert / Z-Curve (Multi-dimensional)</text>
    </g>

    <!-- details -->
    <g transform="translate(30, 245)">
      <rect width="280" height="110" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="15" y="20" fill="#93C5FD" font-size="11" font-weight="700">Características Principais:</text>
      <text x="15" y="42" fill="#E4E4E7" font-size="10">✓ Excelente para filtros em múltiplas colunas</text>
      <text x="15" y="60" fill="#E4E4E7" font-size="10">⚠️ Operação Estática: Precisa rodar OPTIMIZE manual</text>
      <text x="15" y="78" fill="#E4E4E7" font-size="10">❌ Altamente Custo: Reescreve grandes blocos de dados</text>
      <text x="15" y="96" fill="#E4E4E7" font-size="10">❌ Z-Order decai à medida que novos dados chegam</text>
    </g>
  </g>

  <!-- SECTION 3: LIQUID CLUSTERING -->
  <g transform="translate(810, 110)">
    <rect width="340" height="380" rx="10" fill="#0C1518" stroke="#10B981" stroke-width="1" opacity="0.85" />
    <rect width="340" height="380" rx="10" fill="none" stroke="#10B981" stroke-width="2" filter="url(#softGlow)" />
    
    <text x="170" y="30" fill="#34D399" font-size="14" font-weight="800" text-anchor="middle">LIQUID CLUSTERING</text>
    <text x="170" y="48" fill="#A7F3D0" font-size="11" font-weight="700" text-anchor="middle">CLUSTER BY (col1, col2)</text>

    <!-- Liquid clustering Layout -->
    <g transform="translate(30, 75)">
      <rect width="280" height="150" rx="6" fill="#111B17" stroke="#1B4235" stroke-width="1" />
      
      <!-- Fluid grids representation representing dynamic clustered layout -->
      <g transform="translate(20, 20)">
        <!-- Cluster group A -->
        <rect x="0" y="0" width="70" height="50" rx="4" fill="url(#liquidGrad)" opacity="0.3" stroke="#10B981" stroke-width="1" />
        <text x="35" y="22" fill="#A7F3D0" font-size="9" font-weight="700" text-anchor="middle">Chave A</text>
        <text x="35" y="37" fill="#6EE7B7" font-size="8" text-anchor="middle">Dynamic Blocks</text>
        
        <!-- Cluster group B -->
        <rect x="85" y="0" width="70" height="50" rx="4" fill="url(#liquidGrad)" opacity="0.3" stroke="#10B981" stroke-width="1" />
        <text x="120" y="22" fill="#A7F3D0" font-size="9" font-weight="700" text-anchor="middle">Chave B</text>
        <text x="120" y="37" fill="#6EE7B7" font-size="8" text-anchor="middle">Dynamic Blocks</text>

        <!-- Cluster group C -->
        <rect x="170" y="0" width="70" height="50" rx="4" fill="url(#liquidGrad)" opacity="0.3" stroke="#10B981" stroke-width="1" />
        <text x="205" y="22" fill="#A7F3D0" font-size="9" font-weight="700" text-anchor="middle">Chave C</text>
        <text x="205" y="37" fill="#6EE7B7" font-size="8" text-anchor="middle">Dynamic Blocks</text>
      </g>
      
      <!-- Arrow showing dynamic optimization -->
      <g transform="translate(20, 85)">
        <rect width="240" height="45" rx="4" fill="#0C111D" stroke="#047857" stroke-width="1" />
        <text x="120" y="18" fill="#34D399" font-size="10" font-weight="700" text-anchor="middle">Otimização Incremental e Fluida</text>
        <text x="120" y="33" fill="#94A3B8" font-size="8" text-anchor="middle">Evita reescrita de dados não afetados</text>
      </g>
    </g>

    <!-- Pros & Details -->
    <g transform="translate(30, 245)">
      <rect width="280" height="110" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="15" y="20" fill="#34D399" font-size="11" font-weight="700">Por que é a Recomendação Moderna?</text>
      <text x="15" y="42" fill="#E4E4E7" font-size="10">🚀 Totalmente Flexível: Mude as chaves quando quiser!</text>
      <text x="15" y="60" fill="#E4E4E7" font-size="10">🚀 Escrita Incremental: Sem overhead em tabelas gigantes</text>
      <text x="15" y="78" fill="#E4E4E7" font-size="10">🚀 Coexiste com Deletion Vectors &amp; Auto Compact</text>
      <text x="15" y="96" fill="#E4E4E7" font-size="10">🚀 Suporta até 4 chaves de alta cardinalidade</text>
    </g>
  </g>
</svg>
